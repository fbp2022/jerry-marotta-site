name = "jerry-marotta-aviation"
compatibility_date = "2026-09-25"
pages_build_output_dir = "."

# Bind the production D1 database after it is created in Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "jerry-marotta-content"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
